; Grafana for homepower — read-only dashboards over the collector's SQLite DB.
;
; Everything Grafana writes (its own DB, logs, plugins) lives under
; var/grafana/ so it shares the app's gitignored runtime directory.
; Run it with:
;   grafana server --config ops/grafana/grafana.ini \
;     --homepath /opt/homebrew/opt/grafana/share/grafana
; or via the LaunchAgent in ops/com.sefk.grafana.plist.

[paths]
data = /Users/sefk/src/homepower/var/grafana/data
logs = /Users/sefk/src/homepower/var/grafana/log
plugins = /Users/sefk/src/homepower/var/grafana/plugins
provisioning = /Users/sefk/src/homepower/ops/grafana/provisioning

[server]
; 3425 pairs with the app's 8425; both bind all interfaces for LAN access.
http_port = 3425
http_addr =

[analytics]
reporting_enabled = false
check_for_updates = false
feedback_links_enabled = false

[users]
allow_sign_up = false
default_theme = dark
; The data is UTC in SQLite; render in the viewer's zone (Pacific here).
default_timezone = browser

[auth.anonymous]
; A house dashboard on the LAN: anyone on the network reads without a login.
; Editing still requires the admin account (default admin/admin — change it
; on first login, or leave it, since nothing here is writable anyway).
enabled = true
org_name = Main Org.
org_role = Viewer

[auth.basic]
enabled = true

[dashboards]
default_home_dashboard_path = /Users/sefk/src/homepower/ops/grafana/dashboards/live-power.json

[plugin.frser-sqlite-datasource]
; Belt and braces: the plugin already forces _pragma=query_only(1) on every
; connection, so no query from Grafana can write to the collector's DB.
unsafe_disable_query_only_path_option = false
unsafe_allow_attach_limit_above_zero = false

[log]
mode = file
level = info
